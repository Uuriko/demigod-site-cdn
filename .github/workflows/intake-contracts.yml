name: intake-contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  intake-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Check intake script syntax
        run: node --check foot-latest.js
      - name: Run intake contracts
        run: >-
          node --test
          wizard-choice-navigation.test.mjs
          wizard-draft-recovery.test.mjs
          wizard-submission.test.mjs
